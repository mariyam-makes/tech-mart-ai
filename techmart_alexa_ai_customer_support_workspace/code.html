<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alexa | TechMart customer support</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Material+Symbols+Outlined:FILL@0..1" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['DM Sans','sans-serif'],display:['Manrope','sans-serif']},colors:{ink:'#172235',mist:'#f5f7fb',line:'#e3e8f0',violet:'#6357d9',teal:'#148a83'}}}};</script>
<style>*{box-sizing:border-box}body{margin:0;overflow-x:hidden;background:#f5f7fb;color:#172235;font-family:'DM Sans',sans-serif}.app-bg{background:radial-gradient(circle at 70% -10%,rgba(216,227,255,.72),transparent 34%),#f5f7fb}.shadow-soft{box-shadow:0 12px 30px rgba(35,51,81,.06)}.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased}.icon{width:18px;height:18px;display:inline-block;flex:0 0 auto}.nav-active{background:#eeedff;color:#4c42bf}.scrollbar::-webkit-scrollbar{width:6px;height:6px}.scrollbar::-webkit-scrollbar-thumb{background:#ccd4e2;border-radius:20px}.fade-in{animation:fade .35s ease both}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}</style>
<style>.grid > section{min-width:0}</style>
<style>body{background:#e8eff0}.bg-white{background-color:#fbfcf8!important}.bg-mist{background-color:#e7f0ef!important}.bg-\[\#fbfcfe\]{background-color:#f1f6f4!important}.border-line{border-color:#d5dfdf!important}.shadow-soft{box-shadow:0 14px 34px rgba(24,55,63,.09)}</style>
</head>
<body><div id="app" class="min-h-screen app-bg"></div>
<script>
const products=[['MacBook Air M3','Apple','Laptop','$799.99','In Stock','Students & Professionals','13.6&quot; · Apple M3 · 16GB RAM · 512GB SSD'],['WH-1000XM5','Sony','Headphones','$59.99','In Stock','Music & Travel','Noise Cancelling · 30hr Battery']];
const orders=[['ORD-101','Ali','MacBook Air M3','electronics','5 days','Return Approved'],['ORD-102','Sara','WH-1000XM5','electronics','18 days','Status not recorded'],['ORD-103','John','Galaxy S25 Ultra','electronics','3 days','Return Approved'],['ORD-104','Mia','Galaxy Tab S10 Ultra','electronics','22 days','Status not recorded'],['ORD-105','Abis','WH-1000XM5','electronics','18 days','Status not recorded'],['ORD-106','Syed','Galaxy S25 Ultra','electronics','7 days','Return Approved'],['ORD-107','Hussain','WH-1000XM5','electronics','10 days','Return Approved'],['ORD-108','Abis','MacBook Air M3','electronics','0 days','Order Placed'],['ORD-109','Ayyan','Keychron K8 Pro','electronics','0 days','Order Placed']];
const logs=orders.map(o=>['Notebook record',o[1],o[0],'Order record','Order lookup',o[5]]);
const nav=[['chat','Chat','space_dashboard'],['orders','Orders','local_shipping'],['refunds','Refunds','assignment_return'],['logs','Support Logs','history'],['products','Products','inventory_2'],['settings','Settings','settings']];let active='chat',msgs=[],mobile=false,conversationContext={orderId:null,customerEmail:null,approvedRefund:false};
const I=(n,c='')=>`<span class="material-symbols-outlined icon ${c}">${n}</span>`;const B=v=>{let c=['In Stock','Approved','Resolved','Delivered'].includes(v)?'bg-emerald-50 text-emerald-700 border-emerald-200':['Out of Stock','Not eligible','Rejected'].includes(v)?'bg-rose-50 text-rose-700 border-rose-200':'bg-amber-50 text-amber-700 border-amber-200';return`<span class="inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-[11px] font-bold ${c}"><i class="h-1.5 w-1.5 rounded-full bg-current"></i>${v}</span>`};
function extractEmail(text){const match=String(text).match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);return match?match[0]:null}
function extractOrder(text){const match=String(text).match(/ORD-\d+/i);return match?match[0].toUpperCase():null}
function updateConversationContext(data){if(!data||!data.context||typeof data.context !== 'object')return;conversationContext={...conversationContext,...data.context};if(Object.prototype.hasOwnProperty.call(data.context,'orderId')&&data.context.orderId!==null&&data.context.orderId!==undefined)conversationContext.orderId=data.context.orderId;if(Object.prototype.hasOwnProperty.call(data.context,'customerEmail')&&data.context.customerEmail!==null&&data.context.customerEmail!==undefined)conversationContext.customerEmail=data.context.customerEmail;if(Object.prototype.hasOwnProperty.call(data.context,'approvedRefund'))conversationContext.approvedRefund=data.context.approvedRefund;}
function shell(){app.innerHTML=`<div class="flex min-h-screen"><aside class="fixed inset-y-0 left-0 z-30 flex w-[252px] -translate-x-full flex-col border-r border-line bg-white/95 px-4 py-5 transition-transform lg:translate-x-0 ${mobile?'translate-x-0':''}"><div class="flex items-center gap-3 px-2"><div class="grid h-10 w-10 place-items-center rounded-xl bg-violet text-xl font-extrabold text-white shadow-lg shadow-violet-200">A</div><div><div class="font-display text-[15px] font-extrabold">TechMart</div><div class="flex items-center gap-1.5 text-[11px] font-semibold text-slate-500"><i class="h-1.5 w-1.5 rounded-full bg-teal"></i>Alexa AI agent</div></div></div><button id="new" class="mt-8 flex items-center justify-center gap-2 rounded-xl bg-ink px-4 py-3 text-sm font-bold text-white shadow-soft transition hover:bg-[#24344e]">${I('add')} New conversation</button><div class="mt-8 px-3 text-[10px] font-bold uppercase tracking-[.16em] text-slate-400">Workspace</div><nav class="mt-3 space-y-1">${nav.map(([id,l,s])=>`<button data-nav="${id}" class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm font-semibold transition hover:bg-mist ${active===id?'nav-active':'text-slate-500'}">${I(s)}<span class="flex-1">${l}</span>${id==='refunds'?'<span class="rounded-full bg-amber-100 px-2 py-0.5 text-[10px] text-amber-700">14</span>':''}</button>`).join('')}</nav><div class="mt-auto border-t border-line pt-4"><div class="mb-3 flex items-center gap-3 rounded-xl bg-mist p-3"><div class="grid h-9 w-9 place-items-center rounded-full bg-[#d9d6ff] font-bold text-violet">MV</div><div><div class="text-xs font-bold">Marcus Vance</div><div class="text-[11px] text-slate-500">Support supervisor</div></div></div><div class="flex items-center gap-2 px-3 text-xs font-medium text-slate-500">${I('help_outline')} Help & docs</div></div></aside><main class="flex min-w-0 flex-1 flex-col lg:ml-[252px]"><header class="sticky top-0 z-20 flex h-[72px] items-center justify-between border-b border-line bg-[#f7f9fc]/90 px-4 backdrop-blur-md sm:px-7"><div class="flex items-center gap-3"><button id="menu" class="grid h-10 w-10 place-items-center rounded-xl border border-line bg-white text-slate-600 lg:hidden">${I('menu')}</button><div><div class="font-display text-xl font-extrabold sm:text-2xl">AI Customer Support</div><div class="hidden text-xs text-slate-500 sm:block">Alexa is here to help with products, orders, returns and refunds.</div></div></div><div class="flex items-center gap-2"><div class="hidden items-center gap-2 rounded-full border border-emerald-200 bg-emerald-50 px-3 py-2 text-xs font-bold text-emerald-700 md:flex"><i class="h-2 w-2 animate-pulse rounded-full bg-emerald-500"></i>Alexa Online</div><button class="grid h-10 w-10 place-items-center rounded-xl border border-line bg-white text-slate-500">${I('notifications_none')}</button><div class="hidden h-9 w-9 place-items-center rounded-full bg-[#e5e2ff] text-xs font-bold text-violet sm:grid">SJ</div></div></header><div id="content" class="flex-1 p-4 sm:p-7"></div></main></div>`;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{active=b.dataset.nav;mobile=false;shell()});document.getElementById('new').onclick=()=>{active='chat';msgs=[];shell()};document.getElementById('menu').onclick=()=>{mobile=!mobile;shell()};render()}
shell=(()=>{const base=shell;return()=>{base();const header=document.querySelector('header');if(header){const nav=document.createElement('div');nav.className='hidden flex-1 items-center justify-center gap-5 px-6 xl:flex';nav.innerHTML='<div class="flex items-center gap-2 rounded-xl border border-line bg-white px-3 py-2 text-sm text-slate-400">'+I('search')+'<span>Search queries, orders or products</span></div><button data-top="chat" class="border-b-2 border-violet pb-2 text-sm font-bold text-violet">Console</button><button data-top="orders" class="text-sm font-semibold text-slate-500">Live Orders</button><button data-top="products" class="text-sm font-semibold text-slate-500">Catalog</button><button data-top="logs" class="text-sm font-semibold text-slate-500">Analytics</button>';header.insertBefore(nav,header.lastElementChild);nav.querySelectorAll('[data-top]').forEach(button=>button.onclick=()=>{active=button.dataset.top;mobile=false;shell()})}}})();
function head(e,t,c,a=''){return`<div class="mb-7 flex flex-col justify-between gap-4 sm:flex-row sm:items-end"><div><div class="mb-2 text-[11px] font-bold uppercase tracking-[.18em] text-violet">${e}</div><h1 class="font-display text-3xl font-extrabold tracking-tight sm:text-4xl">${t}</h1><p class="mt-2 max-w-2xl text-sm text-slate-500">${c}</p></div>${a}</div>`}
function render(){content.innerHTML=active==='chat'?chat():active==='refunds'?refunds():active==='settings'?settings():table(active);bind()}
function quick(l,s,t){return`<button data-q="${t}" class="flex shrink-0 items-center gap-2 rounded-full border border-line bg-white px-3 py-2 text-xs font-bold text-slate-600 transition hover:border-violet hover:text-violet">${I(s,'h-4 w-4')}<span>${l}</span></button>`}
function welcome(){return`<div class="flex h-full min-h-[500px] flex-col justify-center"><div class="mx-auto w-full max-w-2xl text-center"><div class="mx-auto mb-5 grid h-16 w-16 place-items-center rounded-2xl bg-[#e5e2ff] text-2xl font-extrabold text-violet">A</div><h2 class="font-display text-3xl font-extrabold">Hi! I'm Alexa <span class="text-2xl">👋</span></h2><p class="mt-2 text-slate-500">Your TechMart AI support assistant.</p><p class="mt-7 text-sm font-semibold text-slate-600">How can I help you today?</p><div class="mt-5 grid gap-3 sm:grid-cols-2">${[['Find a product','manage_search','Search catalog & specs'],['Check my order','package_2','Instant tracking lookup'],['Request a refund','receipt_long','Automated eligibility check'],['View return policy','verified_user','30-day guarantee rules']].map(([t,s,d])=>`<button data-q="${t}" class="group rounded-2xl border border-line bg-mist p-4 text-left transition hover:-translate-y-0.5 hover:border-violet hover:bg-white"><span class="mb-3 grid h-9 w-9 place-items-center rounded-xl bg-white text-violet shadow-sm group-hover:bg-violet group-hover:text-white">${I(s)}</span><span class="block text-sm font-bold">${t}</span><span class="mt-1 block text-xs text-slate-500">${d}</span></button>`).join('')}</div></div></div>`}
function response(t){t=t.toLowerCase();if(t.includes('refund')||t.includes('return'))return`<b>Let's look into that return.</b><br>Order <b>#TM-89421</b> is within TechMart's 30-day hardware return window. You can request a full refund with no restocking fee as a Plus member.<div class="mt-3 rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-xs leading-5 text-emerald-800"><b class="flex items-center gap-1">${I('check_circle','h-4 w-4')} Eligible · Refund review ready</b><span>Confirmation email will be sent when the request is approved.</span></div><div class="mt-3 rounded-xl border border-line bg-white p-3 text-xs leading-5 text-slate-600"><b class="mb-1 block text-[10px] uppercase tracking-wider text-violet">Company Policy</b>Eligible within 30 days of delivery when returned with original packaging and accessories.</div>`;if(t.includes('order')||t.includes('track'))return`I found <b>#TM-89421</b> for Sarah Jenkins. The Sony WH-1000XM5 return is being reviewed and your prepaid label is ready.<div class="mt-3 rounded-xl border border-line bg-white p-3 text-xs"><div class="flex justify-between"><b>Order status</b>${B('In return')}</div><div class="mt-3 flex items-center gap-2 text-slate-500">${I('local_shipping','text-violet')} Delivered 12 days ago · Return started today</div></div>`;if(t.includes('policy'))return`Here is the short version of our return policy: most hardware is eligible for a refund within 30 days of delivery. Plus members pay no restocking fee.<div class="mt-3 rounded-xl border border-line bg-white p-3 text-xs leading-5 text-slate-600"><b class="mb-1 block text-[10px] uppercase tracking-wider text-violet">Company Policy</b>Refunds are sent to the original payment method within 3–5 business days after inspection.</div>`;return`I can help with that. Here are a few catalog matches:<div class="mt-3 grid gap-2">${products.slice(0,2).map(p=>`<div class="rounded-xl border border-line bg-white p-3"><div class="flex items-center justify-between gap-2"><b>${p[0]}</b>${B(p[4])}</div><div class="mt-1 text-xs text-slate-500">${p[1]} · ${p[2]} · ${p[6]}</div><div class="mt-2 font-display font-extrabold text-violet">${p[3]} <span class="ml-2 font-sans text-xs font-medium text-slate-400">${p[5]}</span></div></div>`).join('')}</div>`}
function msg(m){return`<div class="mb-5 flex ${m.w?'justify-end':'items-start gap-3'} fade-in">${!m.w?'<div class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-[#e5e2ff] font-extrabold text-violet">A</div>':''}<div class="max-w-[80%]"><div class="rounded-2xl ${m.w?'rounded-br-sm bg-ink text-white':'rounded-tl-sm border border-line bg-mist'} p-4 text-sm leading-6">${m.t}</div><div class="mt-1 px-1 text-[10px] font-medium text-slate-400">${m.w?'You':'Alexa'} · just now</div></div></div>`}
function localResponse(t){const q=t.toLowerCase();const electronicsDays=15;const otherDays=30;const isElectronicsQuestion=/(laptop|phone|tablet|macbook|iphone|android|electronics|device|computer)/.test(q);const hasDays=q.match(/\b(\d+)\b/);const days=hasDays?Number(hasDays[1]):null;if(/return policy|refund policy|policy/.test(q))return`Our return policy is straightforward: electronics must be returned within ${electronicsDays} days of purchase, while other product categories have ${otherDays} days. Refunds are reviewed based on the item category and purchase date.`;if(days!==null){const limit=isElectronicsQuestion?electronicsDays:otherDays;const subject=isElectronicsQuestion?'electronics':'other products';if(days>limit)return`For ${subject}, ${days} days is outside the ${limit}-day return window. If the item is an electronic device such as a laptop, phone, or tablet, the return period is ${electronicsDays} days.`;return`For ${subject}, ${days} days is within the ${limit}-day return window. The final decision depends on the product category and purchase details.`;}if(/refund|return/.test(q))return`For electronic items such as laptops, phones, and tablets, the return window is ${electronicsDays} days from purchase. Other product categories have ${otherDays} days.`;if(/order|track|status|where is my|check my order/.test(q))return'Please provide your order ID, for example ORD-101, so I can check only that order.';return "I'm unable to access that information right now. Please try again shortly."}
async function send(t){if(!t.trim())return;const clean=t.replace(/[<>]/g,'');const orderMatch=extractOrder(clean);const emailMatch=extractEmail(clean);if(orderMatch) conversationContext.orderId=orderMatch;if(emailMatch) conversationContext.customerEmail=emailMatch;if(/refund|return/i.test(clean)&&orderMatch) conversationContext.approvedRefund=false;msgs.push({w:1,t:clean},{w:0,t:'Alexa is checking TechMart data...'});render();try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:clean,context:conversationContext,conversationHistory:msgs.slice(0,-1).map(m=>({role:m.w?'user':'assistant',text:m.t.replace(/<br>/g,' ')}))})});const data=await res.json();updateConversationContext(data);msgs[msgs.length-1]={w:0,t:(data.message||"I'm unable to access that information right now. Please try again shortly.").replace(/\n/g,'<br>')};}catch(error){msgs[msgs.length-1]={w:0,t:localResponse(clean)};}render();setTimeout(()=>document.getElementById('thread')?.scrollTo(0,99999),0)}
function chat(){return`<div class="mx-auto max-w-[1180px] fade-in">${head('Live workspace','How can we help today?','Resolve product questions, order lookups, returns and refunds.')}<div class="grid gap-5 xl:grid-cols-[minmax(0,1fr)_300px]"><section class="flex min-h-[620px] flex-col rounded-2xl border border-line bg-white shadow-soft"><div id="thread" class="scrollbar flex-1 overflow-y-auto p-5 sm:p-7">${msgs.length?msgs.map(msg).join(''):welcome()}</div><div class="border-t border-line bg-[#fbfcfe] p-4 sm:p-5"><div class="mb-3 flex gap-2 overflow-x-auto pb-1">${quick('Search Products','search','Find a product')}${quick('Track Order','local_shipping','Check my order')}${quick('Return / Refund','assignment_return','Request a refund')}${quick('Company Policies','policy','View return policy')}</div><form id="form" class="flex items-center gap-2 rounded-2xl border border-line bg-white p-2 shadow-sm focus-within:border-violet"><button type="button" class="grid h-10 w-10 place-items-center rounded-xl text-slate-400">${I('attach_file')}</button><input id="input" class="min-w-0 flex-1 border-0 bg-transparent px-2 text-sm outline-none placeholder:text-slate-400" placeholder="Ask Alexa about a product, order, return or refund..."/><button class="grid h-10 w-10 place-items-center rounded-xl bg-violet text-white shadow-md">${I('arrow_upward')}</button></form><div class="mt-3 flex justify-between px-1 text-[10px] font-medium text-slate-400"><span>Alexa uses TechMart's verified support knowledge.</span><span class="hidden sm:block">Encrypted support channel</span></div></div></section><aside class="hidden rounded-2xl border border-line bg-white p-5 shadow-soft xl:block"><div class="flex items-center justify-between border-b border-line pb-4"><h3 class="font-display font-extrabold">Live case context</h3>${I('more_horiz','text-slate-400')}</div><div class="mt-5 flex items-center gap-3"><div class="grid h-11 w-11 place-items-center rounded-full bg-[#e5e2ff] font-bold text-violet">SJ</div><div><b class="text-sm">Sarah Jenkins</b><p class="text-xs text-slate-500">Gold Plus member</p></div></div><div class="mt-5 rounded-xl bg-mist p-4"><div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Current intent</div><div class="mt-2 flex justify-between text-sm font-bold"><span>Return & replacement</span><span class="text-teal">99.4%</span></div><div class="mt-3 h-1.5 rounded-full bg-slate-200"><div class="h-full w-[99%] rounded-full bg-teal"></div></div></div><div class="mt-5"><div class="mb-3 text-[10px] font-bold uppercase tracking-wider text-slate-400">Recent orders</div>${orders.slice(0,2).map(o=>`<div class="mb-2 rounded-xl border border-line p-3"><div class="flex justify-between text-xs font-bold"><span>${o[0]}</span>${B(o[5])}</div><div class="mt-2 text-xs">${o[2]}</div><div class="mt-1 text-[11px] text-slate-400">${o[4]} · ${o[3]}</div></div>`).join('')}</div><div class="mt-5 rounded-xl border border-violet-100 bg-[#f5f3ff] p-4 text-xs leading-5 text-slate-600"><b class="flex items-center gap-2 text-violet">${I('verified','h-4 w-4')} Active policy rules</b><div class="mt-2">30-day hardware returns<br>$0 restocking fee for Plus<br>Free prepaid shipping label</div></div></aside></div></div>`}
function table(type){let data=type==='orders'?orders:type==='products'?products:logs,isP=type==='products',isL=type==='logs',title=isP?'Products':isL?'Support Logs':'Orders';let cols=isP?['Product','Category','Brand','Price','Stock','Best for','Specifications']:isL?['Timestamp','Customer','Order ID','Query','Action','Status']:['Order ID','Customer','Product','Category','Days ago','Status'];return`<div class="mx-auto max-w-[1180px] fade-in">${head(isL?'Audit trail':'Operations',title,isL?'A clear record of every question, action and outcome.':isP?'Your live catalog, inventory and product knowledge base.':'Search and resolve customer orders at a glance.')}<div class="rounded-2xl border border-line bg-white shadow-soft"><div class="flex flex-col gap-3 border-b border-line p-4 sm:flex-row sm:items-center sm:justify-between"><div class="relative w-full max-w-sm">${I('search','absolute left-3 top-3 text-slate-400')}<input id="search" class="w-full rounded-xl border border-line bg-mist py-2.5 pl-10 pr-4 text-sm outline-none focus:border-violet" placeholder="Search ${title.toLowerCase()}..."></div><div class="flex items-center gap-2 text-xs font-semibold text-slate-400">${I('filter_list')} All statuses</div></div><div class="scrollbar overflow-x-auto"><table class="w-full min-w-[760px] text-left text-sm"><thead class="bg-mist text-[10px] uppercase tracking-wider text-slate-400"><tr>${cols.map(c=>`<th class="px-5 py-4 font-bold">${c}</th>`).join('')}</tr></thead><tbody id="body">${data.map(r=>isP?`<tr class="border-t border-line hover:bg-mist"><td class="px-5 py-4 font-bold">${r[0]}</td><td class="px-5 py-4 text-slate-500">${r[2]}</td><td class="px-5 py-4">${r[1]}</td><td class="px-5 py-4 font-display font-extrabold text-violet">${r[3]}</td><td class="px-5 py-4">${B(r[4])}</td><td class="px-5 py-4 text-slate-500">${r[5]}</td><td class="px-5 py-4 text-xs text-slate-500">${r[6]}</td></tr>`:isL?`<tr class="border-t border-line hover:bg-mist"><td class="px-5 py-4 text-xs text-slate-500">${r[0]}</td><td class="px-5 py-4 font-bold">${r[1]}</td><td class="px-5 py-4 font-semibold text-violet">${r[2]}</td><td class="px-5 py-4 text-slate-500">${r[3]}</td><td class="px-5 py-4">${r[4]}</td><td class="px-5 py-4">${B(r[5])}</td></tr>`:`<tr class="border-t border-line hover:bg-mist"><td class="px-5 py-4 font-bold text-violet">${r[0]}</td><td class="px-5 py-4 font-semibold">${r[1]}</td><td class="px-5 py-4">${r[2]}</td><td class="px-5 py-4 text-slate-500">${r[3]}</td><td class="px-5 py-4 text-slate-500">${r[4]}</td><td class="px-5 py-4">${B(r[5])}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function refunds(){return`<div class="mx-auto max-w-[1180px] fade-in">${head('Returns center','Refund requests','Review eligibility, approvals and customer notification status.')}<div class="grid gap-4 sm:grid-cols-3">${[['Open requests','14','Needs review'],['Approved this month','86','+12.4% from May'],['Average resolution','1.8h','Within target']].map(x=>`<div class="rounded-2xl border border-line bg-white p-5 shadow-soft"><div class="text-xs font-bold text-slate-400">${x[0]}</div><div class="mt-2 font-display text-3xl font-extrabold">${x[1]}</div><div class="mt-2 text-xs text-teal">${x[2]}</div></div>`).join('')}</div><div class="mt-5 rounded-2xl border border-line bg-white shadow-soft"><div class="border-b border-line p-5"><h2 class="font-display font-extrabold">Recent refund reviews</h2></div>${[['#TM-89421','Sarah Jenkins','Sony WH-1000XM5','Approved','Confirmation email sent'],['#TM-89177','Jon Bell','Pixel Buds Pro 2','Rejected','Outside 30-day return window'],['#TM-89002','Amara Davis','iPad Air M2','Processing','Awaiting warehouse inspection']].map(r=>`<div class="flex flex-col gap-3 border-b border-line p-5 last:border-0 sm:flex-row sm:items-center"><div class="flex-1"><div class="flex items-center gap-2"><b>${r[0]}</b>${B(r[3])}</div><div class="mt-1 text-sm">${r[1]} · ${r[2]}</div><div class="mt-1 text-xs text-slate-500">${r[4]}</div></div><button class="rounded-xl border border-line px-3 py-2 text-xs font-bold text-slate-600">View details ${I('arrow_forward','ml-1 h-4 w-4')}</button></div>`).join('')}</div></div>`}
function settings(){return`<div class="mx-auto max-w-[900px] fade-in">${head('Workspace','Settings','Manage the Alexa support workspace and notification preferences.')}<div class="rounded-2xl border border-line bg-white shadow-soft"><div class="border-b border-line p-5"><h2 class="font-display font-extrabold">Agent configuration</h2><p class="mt-1 text-sm text-slate-500">Backend and AI connections can be configured server-side.</p></div><div class="space-y-5 p-5"><label class="block text-sm font-bold">Agent display name<input value="Alexa" class="mt-2 w-full rounded-xl border border-line bg-mist p-3 text-sm outline-none focus:border-violet"></label><label class="block text-sm font-bold">Support email domain<input value="support@techmart.store" class="mt-2 w-full rounded-xl border border-line bg-mist p-3 text-sm outline-none focus:border-violet"></label><div class="flex items-center justify-between rounded-xl bg-mist p-4"><div><div class="text-sm font-bold">Email confirmations</div><div class="mt-1 text-xs text-slate-500">Send approved refund confirmations server-side.</div></div><div class="h-6 w-11 rounded-full bg-teal p-1"><div class="h-4 w-4 translate-x-5 rounded-full bg-white shadow"></div></div></div></div></div></div>`}
function showRefundDetail(orderId){const record=orders.find(o=>o[0]===orderId);if(!record)return;const modal=document.createElement('div');modal.id='refund-modal';modal.className='fixed inset-0 z-50 grid place-items-center bg-ink/40 p-4 backdrop-blur-sm';modal.innerHTML=`<div class="w-full max-w-lg rounded-2xl border border-line bg-white p-6 shadow-2xl"><div class="flex items-start justify-between gap-4"><div><div class="text-[10px] font-bold uppercase tracking-wider text-violet">Refund detail</div><h2 class="mt-1 font-display text-2xl font-extrabold">${record[0]}</h2></div><button data-close-refund class="grid h-9 w-9 place-items-center rounded-xl bg-mist text-slate-500">${I('close')}</button></div><div class="mt-5 rounded-xl bg-mist p-4 text-sm"><div class="flex justify-between"><b>${record[1]}</b>${B(record[5])}</div><div class="mt-3 grid gap-2 text-slate-600 sm:grid-cols-2"><span>Product: <b class="text-ink">${record[2]}</b></span><span>Category: <b class="text-ink">${record[3]}</b></span><span>Purchased: <b class="text-ink">${record[4]} ago</b></span><span>Order status: <b class="text-ink">${record[5]}</b></span></div></div><div class="mt-5"><label class="text-sm font-bold">Customer email for confirmation<input id="refund-email" type="email" placeholder="customer@example.com" class="mt-2 w-full rounded-xl border border-line bg-mist p-3 text-sm outline-none focus:border-violet"></label><div id="refund-result" class="mt-3 hidden rounded-xl p-3 text-sm"></div></div><div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end"><button data-close-refund class="rounded-xl border border-line px-4 py-2.5 text-sm font-bold text-slate-600">Close</button><button data-send-refund="${record[0]}" class="rounded-xl bg-violet px-4 py-2.5 text-sm font-bold text-white shadow-md shadow-violet-200">Send confirmation email</button></div></div>`;document.body.appendChild(modal);modal.querySelectorAll('[data-close-refund]').forEach(b=>b.onclick=()=>modal.remove());modal.querySelector('[data-send-refund]').onclick=async()=>{const email=modal.querySelector('#refund-email').value.trim(),result=modal.querySelector('#refund-result');if(!email){result.className='mt-3 rounded-xl bg-amber-50 p-3 text-sm text-amber-800';result.textContent='Enter the customer email before sending.';return}result.className='mt-3 rounded-xl bg-mist p-3 text-sm text-slate-600';result.textContent='Sending securely from the server...';try{const res=await fetch('/api/refund',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:record[0],customer:record[1],product:record[2],customerEmail:email})});const data=await res.json();result.className=`mt-3 rounded-xl p-3 text-sm ${res.ok?'bg-emerald-50 text-emerald-800':'bg-rose-50 text-rose-800'}`;result.textContent=data.message||'Refund email request completed.'}catch(e){result.className='mt-3 rounded-xl bg-rose-50 p-3 text-sm text-rose-800';result.textContent="I've approved your refund, but I couldn't send the confirmation email right now. Please try again shortly."}}}
document.addEventListener('click',e=>{const button=e.target.closest('button');if(button?.textContent.includes('View details')){const row=button.closest('div.flex');const id=row?.querySelector('b')?.textContent.trim();showRefundDetail(id)}});
function bind(){document.querySelectorAll('[data-top]').forEach(b=>b.onclick=()=>{active=b.dataset.top;mobile=false;shell()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{let x={'Find a product':'Show me products with prices and stock','Search Products':'Show me products with prices and stock','Check my order':'Show my recent orders','Track Order':'Show my recent orders','Request a refund':'I want to request a refund for ORD-101','Return / Refund':'I want to request a refund for ORD-101','View return policy':'Show me the return policy','Company Policies':'Show me the company policy for returns, refunds, shipping, warranty, and exchanges'}[b.dataset.q]||b.dataset.q;send(x)});let f=document.getElementById('form');if(f)f.onsubmit=e=>{e.preventDefault();let i=document.getElementById('input');send(i.value);i.value=''};let s=document.getElementById('search');if(s)s.oninput=()=>document.querySelectorAll('#body tr').forEach(r=>r.classList.toggle('hidden',!r.innerText.toLowerCase().includes(s.value.toLowerCase())))}
function response(t){t=t.toLowerCase();if(t.includes('refund')||t.includes('return'))return`<b>Let's look into order ORD-101.</b><br>Ali's MacBook Air M3 was purchased 5 days ago and is within the 15-day electronics return period.<div class="mt-3 rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-xs leading-5 text-emerald-800"><b class="flex items-center gap-1">${I('check_circle','h-4 w-4')} Eligible · Refund approved</b><span>Current order status: Return Approved.</span></div><div class="mt-3 rounded-xl border border-line bg-white p-3 text-xs leading-5 text-slate-600"><b class="mb-1 block text-[10px] uppercase tracking-wider text-violet">Company Policy</b>Electronics can be returned within 15 days. Refunds follow the TechMart return policy.</div>`;if(t.includes('order')||t.includes('track'))return`I found <b>ORD-101</b> for Ali. The MacBook Air M3 was purchased 5 days ago and its current status is <b>Return Approved</b>.<div class="mt-3 rounded-xl border border-line bg-white p-3 text-xs"><div class="flex justify-between"><b>Order status</b>${B('Return Approved')}</div><div class="mt-3 flex items-center gap-2 text-slate-500">${I('local_shipping','text-violet')} MacBook Air M3 · electronics · 5 days ago</div></div>`;if(t.includes('policy'))return`TechMart electronics can be returned within 15 days of purchase.<div class="mt-3 rounded-xl border border-line bg-white p-3 text-xs leading-5 text-slate-600"><b class="mb-1 block text-[10px] uppercase tracking-wider text-violet">Company Policy</b>Refund processing follows the TechMart return policy.</div>`;return`I can help with that. Here are the verified products from the TechMart catalog:<div class="mt-3 grid gap-2">${products.map(p=>`<div class="rounded-xl border border-line bg-white p-3"><div class="flex items-center justify-between gap-2"><b>${p[0]}</b>${B(p[4])}</div><div class="mt-1 text-xs text-slate-500">${p[1]} · ${p[2]} · ${p[6]}</div><div class="mt-2 font-display font-extrabold text-violet">${p[3]} <span class="ml-2 font-sans text-xs font-medium text-slate-400">${p[5]}</span></div></div>`).join('')}</div>`}
function refunds(){const items=orders.filter(o=>o[5].toLowerCase().includes('return'));return`<div class="mx-auto max-w-[1180px] fade-in">${head('Returns center','Refund requests','Review eligibility, approvals and customer notification status from the RAG order records.')}<div class="grid gap-4 sm:grid-cols-3">${[['Orders in return flow',items.length,'From notebook orders'],['Eligible electronics',orders.filter(o=>Number.parseInt(o[4])<=15).length,'15-day policy window'],['Confirmation email','Server-side','Vercel SMTP endpoint']].map(x=>`<div class="rounded-2xl border border-line bg-white p-5 shadow-soft"><div class="text-xs font-bold text-slate-400">${x[0]}</div><div class="mt-2 font-display text-3xl font-extrabold">${x[1]}</div><div class="mt-2 text-xs text-teal">${x[2]}</div></div>`).join('')}</div><div class="mt-5 rounded-2xl border border-line bg-white shadow-soft"><div class="border-b border-line p-5"><h2 class="font-display font-extrabold">Refund review records</h2></div>${items.map(r=>`<div class="flex flex-col gap-3 border-b border-line p-5 last:border-0 sm:flex-row sm:items-center"><div class="flex-1"><div class="flex items-center gap-2"><b>${r[0]}</b>${B(r[5])}</div><div class="mt-1 text-sm">${r[1]} · ${r[2]}</div><div class="mt-1 text-xs text-slate-500">${r[3]} · purchased ${r[4]} ago</div></div><button class="rounded-xl border border-line px-3 py-2 text-xs font-bold text-slate-600">View details ${I('arrow_forward','ml-1 h-4 w-4')}</button></div>`).join('')}</div></div>`}
document.addEventListener('click',event=>{const button=event.target.closest('[data-q]');if(button&&/Check my order|Track Order/.test(button.innerText))button.dataset.q='Track my order'},true);
shell();
